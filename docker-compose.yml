services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: 4danyone-webui:latest
    container_name: 4danyone-webui
    ports:
      - "7860:7860" # control / upload page
      - "7861:7861" # official 4DAnyone Space (viewer)
    volumes:
      - models:/app/models
      - data:/app/data
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      AUTO_DOWNLOAD_MODELS: "false"
      DEFAULT_ATTENTION_BACKEND: auto
      MOTION_BACKEND: gvhmr # default for the control-page dropdown: gvhmr | prompthmr | smplerx
      CLEAR_ON_START: "true" # delete previous runs/uploads/cache/logs before each new video
      # PUBLIC_VIEWER_URL: "http://<host>:7861"
      # VIDEO_PATH: "/app/data/source/pexels/2785536-uhd_2160_3840_25fps.mp4"
      # OUTPUT_DIR: "/app/data/fdanyone/my-run"
      # SMPLX_SOURCE: "/app/data/smplx/models_smplx_v1_1.zip"
    # Shared IPC so torch distributed (NCCL mp.spawn between the 3 visible GPUs)
    # and torch.from_file(shared=True) have a shared-memory arena.
    ipc: host
    shm_size: "1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  models:
  data:
